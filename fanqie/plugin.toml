# 站点插件的元数据。只写"不会随发布变化"的内容。
#
# url / version / abi / size / sha256 一律由 tools/build_site.py 从构建产物和
# Cargo.toml 推导——手写这些字段必然写错（旧的 plugin.json 就写过一个 404 地址）。

name = "fanqie"
site_name = "番茄小说"
site_id = "fanqie"
site_domain = "fanqienovel.com"
description = "番茄小说（fanqienovel.com）免费章节下载。支持目录、正文、搜索与封面。"
author = "RhenCloud"
license = "GPL-3.0"
data_source = "fanqienovel.com 公开可访问内容"
authorization_boundary = "仅下载公开免费章节；不实现账号密码登录，不绕过付费或访问控制"
maintenance = "active"
known_limitations = ["依赖番茄公开接口与设备状态", "服务端风控可能导致请求失败"]

# 插件真实申请的宿主能力与访问域名。
#
# 这两项**必须与 src/lib.rs 里 metadata() 的返回值逐项一致**，否则
# build_site.py 直接失败。写在这里不是给宿主当安全边界用的——宿主的策略
# 永远取 WASM 自己的声明——而是为了让 registry 上展示的权限有据可查，
# 并且让"多申请一个 secret-read"这种改动在 review 时无法悄悄溜过去。
permissions = ["http", "clock", "storage-read", "storage-write"]
allowed_domains = ["fanqienovel.com", "snssdk.com"]

# 宿主兼容范围（闭区间）。ABI 版本只保证接口形状兼容，管不了行为差异：
# 宿主的燃料预算、限流策略、章节落盘语义都会变。没有这两个字段时，
# 一次宿主升级可以让插件静默变慢或变错，用户只会看到"下载失败"。
#
# 下限写“插件用到的第一个宿主版本”，上限在确认新版行为没变之前不要抬高。
min_host_version = "0.1.0"
max_host_version = "0.1.99"

# 与 ILP/crates/ilp-plugin-wit/wit/plugin.wit 里的 `package ilp:plugin@x.y.z` 一致。
# build_site.py 会校验它，防止 WIT 升版后这里忘记同步。
abi = "0.2.0"
