[package]
name = "ilp-plugin-fanqie"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 默认走 git 依赖（CI 用）；本地无网/无远端时用 .cargo/config.toml 的 patch 覆盖。
ilp-plugin-wit = { git = "https://github.com/ILP-Project/ILP", tag = "abi-v0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
md5 = { package = "md-5", version = "0.10" }
flate2 = "1"
base64 = "0.22"
sha2 = "0.10"
